name: '🤖 Copilot Review'
# Requests a Copilot code review when a pull request opens or leaves draft, through the shared
# workflow in christhonie/event. RELEASE_PAT is the operator's token: GitHub only accepts a review
# request for Copilot from a user, not from the workflow token.

on:
  pull_request:
    types: [opened, ready_for_review]

jobs:
  copilot-review:
    name: Request Copilot Review
    uses: christhonie/event/.github/workflows/copilot-review.yml@main
    secrets:
      RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
