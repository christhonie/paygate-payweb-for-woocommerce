name: '✅ Merge Eligibility'
# Keeps the `ready-to-merge` label on a pull request true to the facts GitHub already holds: reviews
# in, review threads answered, checks green. The work is done by the shared workflow in
# christhonie/idealogic-workflows; see its header. Re-evaluated on every event that can change the
# answer. Fork PRs have a read-only token, so the label is never written for them: correct, since
# it marks code the maintainer has adopted. A label added by hand is the maintainer's own call and
# is reconciled on the next review or check event.

on:
  pull_request:
    types: [synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled, review_requested, review_request_removed]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: ['🧪 PR Checks', 'Test']    # Test is the PHPUnit workflow that #1 adds
    types: [in_progress, completed]    # in_progress clears the label while a rerun is running

jobs:
  merge-eligibility:
    name: Merge eligibility
    if: >-
      (github.event_name != 'pull_request' || github.event.label.name != 'ready-to-merge') &&
      (github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number)
    uses: christhonie/idealogic-workflows/.github/workflows/merge-eligibility.yml@main
    permissions:
      pull-requests: write
      contents: read
      checks: read
      statuses: read
    with:
      pr: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
